# Runs main's repository guards against a pull request. pull_request_target takes this
# workflow from main, so a pull request cannot edit or skip it. It never runs the pull
# request's code: the change is checked out as data, the guards' dependencies come from main
# and install without lifecycle scripts, and only main's scripts execute. The token is read-only.
name: guards

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main's guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the change as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: change
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: trusted/.nvmrc

      - name: Install the guards' dependencies without install scripts
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Run main's guards against the change
        working-directory: change
        run: |
          set -eu
          guards=../trusted/scripts
          node "$guards/wiki/wiki-lint.ts" --root .
          node "$guards/skills/skill-lint.ts" --root .
          node "$guards/governance/governance-guard.ts" --root .
          node "$guards/wiki/wiki-compliance.ts"
          node "$guards/changes/changelog-guard.ts"
          node "$guards/changes/repo-memory-guard.ts"
