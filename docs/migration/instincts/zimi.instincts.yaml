## Action
Follow the zeem rule where it disagrees with an ECC rule, an ECC or repository skill, or a wiki page, and read each zeem file's Overrides of ECC section.

## Evidence
From Zimi (ported to Zeemrepo CLAUDE.md and docs/migration/rules-distill.md). Prevention: None automated beyond review; recorded in CLAUDE.md.
