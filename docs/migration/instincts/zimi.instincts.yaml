source_repo: ahzeems/Zeemrepo
---

## Action
Configure only Claude Code with the pinned ECC plugin; put repository rules in CLAUDE.md and .claude/rules/zeem, and mark user-only skills with disable-model-invocation and the userOnly list.

## Evidence
Decided in Zeemrepo (wiki/decisions/ADR-0024 Claude Code is the only harness.md). Check: skills:lint enforces userOnly against disable-model-invocation; scripts/git/hooks.test.ts asserts the ECC pin.

